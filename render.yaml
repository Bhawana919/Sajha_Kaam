# Render blueprint: New -> Blueprint -> pick this repo. Free plan is fine for the demo.
services:
  - type: web
    name: sajha-kaam-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: LLM_PROVIDER
        value: none          # set to "anthropic" and add LLM_API_KEY in the dashboard to enable AI drafting
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_SEED_B64
        generateValue: true   # any secret string; hashed to a 32-byte Ed25519 seed
      - key: ADMIN_DEMO_PASSWORD
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false          # set to the service URL, e.g. https://sajha-kaam-api.onrender.com
      - key: LLM_API_KEY
        sync: false
